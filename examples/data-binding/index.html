<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spacetime Data Binding Demo</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f8f9fa;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .header {
            background: #fff;
            border-bottom: 1px solid #e9ecef;
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #007bff;
        }

        .cart-button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-count {
            background: #fff;
            color: #007bff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 12px;
        }

        /* Hero */
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            opacity: 0.9;
        }

        /* Section */
        .section {
            padding: 60px 0;
        }

        .section-title {
            font-size: 32px;
            margin-bottom: 40px;
            text-align: center;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e9ecef;
        }

        .product-content {
            padding: 20px;
        }

        .product-category {
            display: inline-block;
            font-size: 12px;
            text-transform: uppercase;
            color: #6c757d;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-description {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 24px;
            font-weight: 700;
            color: #007bff;
        }

        .product-stock {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .product-stock.in-stock {
            background: #d4edda;
            color: #155724;
        }

        .product-stock.out-of-stock {
            background: #f8d7da;
            color: #721c24;
        }

        /* Testimonials */
        .testimonials-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .testimonial-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .testimonial-quote {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #495057;
            font-style: italic;
        }

        .testimonial-quote::before {
            content: '"';
            font-size: 48px;
            color: #e9ecef;
            line-height: 0;
            display: block;
            margin-bottom: 10px;
        }

        .testimonial-author {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .testimonial-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
        }

        .testimonial-info {
            flex: 1;
        }

        .testimonial-name {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .testimonial-role {
            font-size: 14px;
            color: #6c757d;
        }

        /* Loading State */
        .state-loading {
            opacity: 0.5;
            position: relative;
            min-height: 400px;
        }

        .state-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border: 4px solid #e9ecef;
            border-top-color: #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .state-empty::after {
            content: 'No items to display';
            display: block;
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
            font-size: 18px;
        }

        /* Cart Total */
        .cart-total-section {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 0 auto;
        }

        .cart-total-label {
            font-size: 18px;
            color: #6c757d;
            margin-bottom: 10px;
        }

        .cart-total-value {
            font-size: 48px;
            font-weight: 700;
            color: #007bff;
        }

        /* Footer */
        .footer {
            background: #343a40;
            color: white;
            padding: 40px 0;
            text-align: center;
            margin-top: 80px;
        }

        .footer p {
            opacity: 0.8;
        }
    </style>
    <style>:not(:defined){visibility:hidden}</style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">Spacetime Demo</div>
                <button class="cart-button">
                    Cart
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <div class="container">
            <h1>Data Binding Demo</h1>
            <p>A complete example of Spacetime's data binding features</p>
        </div>
    </section>

    <!-- Products Section -->
    <section class="section">
        <div class="container">
            <h2 class="section-title">Our Products</h2>
            <div class="product-grid">
                <!-- Products will be generated here by Spacetime -->
            </div>
        </div>
    </section>

    <!-- Testimonials Section -->
    <section class="section" style="background: white;">
        <div class="container">
            <h2 class="section-title">What Our Customers Say</h2>
            <div class="testimonials-grid">
                <!-- Testimonials will be generated here by Spacetime -->
            </div>
        </div>
    </section>

    <!-- Cart Total Section -->
    <section class="section">
        <div class="container">
            <div class="cart-total-section">
                <div class="cart-total-label">Shopping Cart Total</div>
                <div class="cart-total-value">$0.00</div>
            </div>
        </div>
    </section>

    <!-- Templates -->
    <template id="product-card">
        <div class="product-card">
            <img slot="image" class="product-image" src="" alt="">
            <div class="product-content">
                <span slot="category" class="product-category"></span>
                <h3 slot="name" class="product-name"></h3>
                <p slot="description" class="product-description"></p>
                <div class="product-footer">
                    <span slot="price" class="product-price"></span>
                    <span slot="stock" class="product-stock"></span>
                </div>
            </div>
        </div>
    </template>

    <template id="testimonial-card">
        <div class="testimonial-card">
            <p slot="quote" class="testimonial-quote"></p>
            <div class="testimonial-author">
                <div slot="avatar" class="testimonial-avatar"></div>
                <div class="testimonial-info">
                    <div slot="name" class="testimonial-name"></div>
                    <div slot="role" class="testimonial-role"></div>
                </div>
            </div>
        </div>
    </template>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>Built with Spacetime Data Binding</p>
            <p>Open the console with ?debug=spacetime to see what's happening</p>
        </div>
    </footer>

    <!-- Runtime and Generated Code -->
    <script src="/public/runtime/data-binding.js"></script>
    <script src="styles.js"></script>
    <link rel="stylesheet" href="../../spacetime.css" />
    <script src="../../spacetime.js"></script>
</body>
</html>
