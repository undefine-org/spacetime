[package]
name = "spacetime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/undefine-org/spacetime"
description = "Declarative animation DSL - timelines as first-class constructs"
default-run = "spacetime"

[lib]
# cdylib omitted: V8 (rustyscript) uses TLS relocations incompatible with shared libs.
# WASM builds use wasm-pack which overrides crate-type to cdylib automatically.
crate-type = ["rlib"]

[dependencies]
# Web server
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "catch-panic"] }
tokio-tungstenite = "0.21"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Build-status handshake: an external process hashes the source it just wrote
# and awaits a matching content_sha256 — sha256 because the BEAM side computes
# it natively (:crypto), unlike blake3.
sha2 = "0.10"
bincode = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# EDN reader/writer (PLAN-148: EDN as a second concrete syntax over the %form
# registry). Pure Rust, no C, no V8. Used ONLY by `src/edn/` -- the `.st` path
# never touches it.
clojure-reader = "0.3"

# Parser
rowan = "0.16"
miette = { version = "7.6", features = ["fancy"] }
logos = "0.14"

# Utils
thiserror = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
fastcdc = "3"

# LSP support (optional)
tower-lsp = { version = "0.20", optional = true }
dashmap = { version = "6", optional = true }
petgraph = { version = "0.6", optional = true }
notify = { version = "6.0", optional = true }
serde_yaml = { version = "0.9", optional = true }

# WASM support (optional)
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }

# Compression (for bundle profiling; also used by host_package's
# archive builder, PLAN-075)
flate2 = "1"
zstd = "0.13"
# Archive building (host_package's shared tar+gzip packaging, PLAN-075 --
# lifted from commercial/host's own spacetime-host-cli::package_directory
# so both callers share ONE implementation instead of two).
tar = "0.4"
# Outbound HTTP for the local host-push route (PLAN-075): verse's dev
# server forwards a packaged archive to the real spacetime-host-server
# orchestrator. rustls-tls (not native-tls) to avoid a system OpenSSL
# dependency, matching commercial/host's own reqwest feature choice.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# HTML transformation
lol_html = "2"
# SWC parsing (for JS syntax validation without V8)
swc_common = "9.2"
swc_ecma_parser = "12.0"
swc_ecma_ast = "9.0"

# Headless testing via V8/deno_core (optional)
rustyscript = { version = "0.12", optional = true, features = ["console"] }

# CSS parsing/validation (optional, used for output validation)
lightningcss = { version = "=1.0.0-alpha.67", optional = true }


# Browser substrate via Chrome DevTools Protocol (pure-Rust, optional).
# PLAN-027 W2: drives a warm Chromium for the layout/timing/paint rungs and
# (W7) live automation. NOT a vendored .st — it is a compiler-crate dependency.
chromiumoxide = { version = "0.9", optional = true, default-features = false }

# File watching
futures-util = "0.3"
base64 = "0.22.1"
log = "0.4.29"
env_logger = "0.11.8"

# Performance tracing (optional)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"], optional = true }
tracing-chrome = { version = "0.7", optional = true }
tracing-log = { version = "0.2", optional = true }
html5ever = "0.39"
which = "8.0.5"
tempfile = "3"

[features]
default = ["lsp", "headless"]
lsp = ["tower-lsp", "dashmap", "petgraph", "notify", "serde_yaml"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "console_error_panic_hook", "js-sys"]
headless = ["rustyscript", "lightningcss"]
# CDP browser substrate (chromiumoxide). Enables the layout/timing/paint rungs.
# (Replaces the removed `browser`/Playwright feature — PLAN-027 W2.)
cdp = ["chromiumoxide"]
# Chrome Trace profiling for dev server reload path
perf-trace = ["tracing", "tracing-subscriber", "tracing-chrome", "tracing-log"]

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
rustyscript = { version = "0.12", features = ["console"] }
lightningcss = "=1.0.0-alpha.67"
insta = "1.34"
glob = "0.3"
chromiumoxide = { version = "0.9", default-features = false }
serial_test = "3"
dashmap = "6"
proptest = "1.11.0"

# `tests/lang/` holds language-surface tests (see tests/lang/README.md). Cargo
# only auto-discovers `tests/*.rs` at the top level, so Rust companions living
# in that hierarchy are registered explicitly. A companion exists only where a
# `.test.st` cannot reach — e.g. asserting a COMPILE-TIME diagnostic code.
[[test]]
name = "registry_addressing_diagnostics"
path = "tests/lang/registry_addressing_diagnostics.rs"

[[test]]
name = "gh23_poison_rule"
path = "tests/parser/gh23_poison_rule_test.rs"

[[test]]
name = "render_test"
path = "tests/render/render_test.rs"
required-features = ["cdp"]

[[bench]]
name = "lsp_benchmark"
harness = false

[patch.crates-io]
# serde 1.0.220+ replaced serde::__private with version-tagged serde::__private$$
# and removed Deserialize impl for Content. Old SWC crates (swc_config 3.0.0,
# swc_common 9.2.0, ast_node 3.0.0) depend on both. Patched to restore compat.
serde = { path = ".patches/serde" }
serde_core = { path = ".patches/serde_core" }

[[test]]
name = "g1_primitive_reachability"
path = "tests/generalizations/g1_primitive_reachability_test.rs"
