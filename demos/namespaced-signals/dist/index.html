<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Namespaced Signals — Spacetime</title>
  <link rel="stylesheet" href="spacetime.css" />
<link rel="stylesheet" href="/spacetime.css"></head>
<body>
  <main class="card">
    <header class="card__head">
      <p class="eyebrow">Spacetime</p>
      <h1>Pan &amp; zoom state</h1>
    </header>

    <section class="readout">
      <div class="readout__cell">
        <span class="readout__label">deltaX</span>
        <span class="readout__value val-x">0</span>
      </div>
      <div class="readout__cell">
        <span class="readout__label">deltaY</span>
        <span class="readout__value val-y">0</span>
      </div>
      <div class="readout__cell">
        <span class="readout__label">scale</span>
        <span class="readout__value val-scale">100</span>
      </div>
    </section>

    <section class="pad">
      <span class="spacer"></span>
      <button class="up" type="button">&uarr;</button>
      <button class="zoom" type="button">+ zoom</button>
      <button class="left" type="button">&larr;</button>
      <button class="reset" type="button">reset</button>
      <button class="right" type="button">&rarr;</button>
      <span class="spacer"></span>
      <button class="down" type="button">&darr;</button>
      <span class="spacer"></span>
    </section>
  </main>

  
<script src="/spacetime.js"></script></body>
</html>
