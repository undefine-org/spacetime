<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fit to Box — @fit shrink-to-fit</title>
  <link rel="stylesheet" href="spacetime.css" />
</head>
<body>
  <div class="stage">
    <p class="eyebrow">@fit · pretext</p>

    <div class="box">
      <h2 class="fit-line">SHRINK TO FIT</h2>
    </div>

    <div class="box box--wide">
      <h2 class="fit-line">RESIZE ME</h2>
    </div>

    <p class="meta">Drag the right edge of each box. The text grows or shrinks to
    the largest size that fits one line — never overflowing, never reflowing.</p>
  </div>

  <script src="/__spacetime/runtime.js?entry=index.st"></script>
</body>
</html>
