<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reactive List — Spacetime</title>
  <link rel="stylesheet" href="spacetime.css" />
<link rel="stylesheet" href="/spacetime.css"></head>
<body>
  <main class="card">
    <header class="card__head">
      <p class="eyebrow">Spacetime</p>
      <h1>Tasks (<span class="count">3</span>)</h1>
    </header>

    <ul class="task-list"></ul>

    <div class="actions">
      <button class="add-task" type="button">Add task</button>
      <button class="clear-tasks" type="button">Clear all</button>
    </div>
  </main>

  
<script src="/spacetime.js"></script></body>
</html>
