<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LiveView Kanban — Spacetime</title>
  <link rel="stylesheet" href="spacetime.css" />
</head>
<body>
  <main class="stage">
    <span class="hostbadge">ws://verse · dev</span>

    <div class="board">
      <section class="col" data-col="todo">
        <header class="col__head"><h2>To do</h2></header>
        <div class="col__cards"></div>
      </section>
      <section class="col" data-col="doing">
        <header class="col__head"><h2>Doing</h2></header>
        <div class="col__cards"></div>
      </section>
      <section class="col" data-col="done">
        <header class="col__head"><h2>Done</h2></header>
        <div class="col__cards"></div>
      </section>
    </div>

    <div class="timetravel">
      <span class="tt__label">scrub history</span>
      <input type="range" class="tt__range" min="0" max="0" value="0" />
    </div>

    <aside class="contract">
      <div class="contract__head">this board's wire protocol (live from the registry)</div>
      <ul class="proto"></ul>
    </aside>
  </main>

</body>
</html>
