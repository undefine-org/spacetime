<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Shell — @view / @portal / @effect (Spacetime)</title>
  <link rel="stylesheet" href="spacetime.css" />
</head>
<body>
  <div class="app">
    <nav class="rail">
      <button class="rail__list" type="button">List</button>
      <button class="rail__graph" type="button">Graph</button>
      <button class="rail__settings" type="button">Settings</button>
      <button class="rail__add" type="button">Add row (rows: <span class="row-count">3</span>)</button>
      <button class="rail__open" type="button">Open modal</button>
    </nav>
    <main class="stage"></main>
  </div>

  <div class="modal" tabindex="-1" role="dialog" aria-label="Demo modal">
    <h2>Portal modal</h2>
    <p>This dialog escaped the layout grid to <code>&lt;body&gt;</code>. Scroll is locked,
       focus is trapped, and <kbd>Esc</kbd> closes it.</p>
    <button class="modal__close" type="button">Close</button>
  </div>

  <script src="spacetime.js"></script>
</body>
</html>
