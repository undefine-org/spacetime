<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Team Plan Configurator</title>
  <link rel="stylesheet" href="spacetime.css" />
</head>
<body>
  <main class="card">
    <header class="card__head">
      <p class="eyebrow">Orbit</p>
      <h1>Team plan</h1>
      <p class="lede">Reactive pricing — every number below is a live Spacetime signal.</p>
    </header>

    <section class="control">
      <span class="control__label">Seats</span>
      <div class="stepper">
        <button class="seats-dec" type="button" aria-label="Remove a seat">&minus;</button>
        <span class="seat-count stepper__value">3</span>
        <button class="seats-inc" type="button" aria-label="Add a seat">&plus;</button>
      </div>
    </section>

    <section class="control">
      <span class="control__label">Billing</span>
      <button class="billing-toggle pill" type="button">
        <span class="billing-label">Monthly</span>
      </button>
    </section>

    <p class="savings-note">Switch to annual and save 20%</p>

    <footer class="summary">
      <div class="summary__row">
        <span>Monthly cost</span>
        <span>$<span class="monthly-cost">36</span></span>
      </div>
      <div class="summary__total">
        <span>Total</span>
        <span class="summary__amount">
          $<span class="grand-total">36</span><span class="billing-period">/month</span>
        </span>
      </div>
    </footer>
  </main>

  <script src="/__spacetime/runtime.js?entry=index.st"></script>
</body>
</html>
