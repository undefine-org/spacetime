# cargo-fuzz target crate (PLAN-027 W4, compiler tier).
# Fuzzes the Spacetime parser/compiler for panics & hangs.
#
# Usage (requires nightly + cargo-fuzz: `cargo install cargo-fuzz`):
#   cargo +nightly fuzz run parse
#   cargo +nightly fuzz run parse -- -max_total_time=60
#
# Corpus is seeded from tests/ fixtures; see fuzz/README.md.
[package]
name = "spacetime-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.spacetime]
path = ".."
default-features = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compile"
path = "fuzz_targets/compile.rs"
test = false
doc = false
bench = false
