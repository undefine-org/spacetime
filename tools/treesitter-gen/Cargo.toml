[package]
name = "treesitter-gen"
version = "0.1.0"
edition = "2021"
description = "Generate Tree-sitter grammar from Spacetime %form declarations"

[dependencies]
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
